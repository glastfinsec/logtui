[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logtui"
version = "0.1.0"
description = "Cross-platform terminal system log viewer"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-textual-snapshot>=1.1,<2",
    "ruff>=0.5",
]

[project.scripts]
logtui = "logtui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"logtui.rules" = ["*.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]